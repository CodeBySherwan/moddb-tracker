[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moddb-tracker"
version = "2.1.0"
description = "Track ModDB mod downloads, comments and milestones from a desktop GUI or scheduled CLI task"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "curl_cffi>=0.7",
    "matplotlib",
    "moddb",
    "openpyxl",
    "PyQt6",
    "pyqtgraph",
    "reportlab",
    "winotify",
]

[project.scripts]
moddb-tracker = "ui.main_window:main"

[tool.setuptools]
py-modules = ["analytics", "charts", "gui", "notify", "storage", "tracker", "transport"]

[tool.setuptools.packages.find]
include = ["ui*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
